    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <title>Sweep Tracker</title>
    <link rel="stylesheet" crossorigin href="./assets/app.css?v=20261106-4" />
    <!-- Standalone data source: the embedded fallback snapshot and the
         fetch shim (v2) that answers the page's own ./actions calls
         from the HueTX/sweep-tracker repo on GitHub — tracker.json's
         retooled view-model passes through as the page's view/lists,
         control requests go to control-requests.json under their own tap ids
         and stay "Requested" until their own ack. These two classic
         scripts are the only additions to the live page; the bundle
         below is the live sweep-tracker's own, with standalone
         patches (fixed 2026-11-06): a running sweep can never
         headline "Sweep complete" from lane/stage states alone;
         a present-tense activity headline can never contradict
         the master switch ("Sweep is off" wins, and the live
         pill requires the switch on); and the titles pill, card
         legend, family list and counts all derive from the live
         view's own titles (58 families when the view carries 58),
         not the stale 48-family set or the today counter. The
         shim adds the matching reconciliation: with the switch
         off, the view's frozen searching lanes/stages are
         downgraded to their stopped record before rendering —
         including the run's own status (view, run and snapshot
         status all read "stopped", so the run clock freezes at
         the last update and no "stalled" diagnosis fires) and
         the now-searching pill, which the bundle gates only on
         document freshness, never on the switch. One more patch
         (fixed 2026-11-06): the lane restart controls — the bulk
         "Restart selected searches" button and the per-lane /
         per-board restart buttons — are no longer disabled by
         that same stale-data pause. The pause (view older than
         10 minutes, snapshot older than 15) locked every control
         whenever the tracker data aged, which is exactly when
         stopped lanes need restarting, so the recovery action
         was unreachable in the state it exists for; restart taps
         still stay disabled while a restart for the same lanes
         is already requested or actuating, and all other
         controls keep the pause. The ?v= stamps
         on the asset URLs are bumped with each fix so a cached
         copy of an older bundle cannot keep rendering on a
         reader's device after the fix ships. -->
    <script src="./assets/fallback.js?v=20261106-4"></script>
    <script src="./assets/shim.js?v=20261106-4"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="sweep-tracker-standalone"
    ></div>
    <!-- The live page loads this bundle as a deferred module; here it
         loads as a classic script at the end of the body so the root
         element above exists when it runs. -->
    <script src="./assets/app.js?v=20261106-4"></script>
  </body>
</html>
